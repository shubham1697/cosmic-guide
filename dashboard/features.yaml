meta:
  app: CosmicGuide
  source: docs/TODO.md
sections:
- name: 🐛 Bugs / Investigations
  items:
  - title: 'Today''s Horoscope opened the Kundli screen in Vedic mode — FIXED (Jul 24). The daily card
      was wired to onChartTap, which falls back to the Vedic/Kundli tab when there is no Chart tab (Vedic
      navigation). It now pushes the detailed HoroscopeScreen directly, threaded with the resolved system
      (western/vedic), so it behaves the same in every tradition. This also repurposes the previously
      orphaned lib/screens/horoscope_screen.dart. Files: lib/screens/home_screen.dart, lib/screens/horoscope_screen.dart,
      lib/main.dart.'
    status: done
  - title: 'Tarot cards not loading — Likely resolved: backend/logs/audit.log shows /api/v1/tarot/draw
      returning 200 consistently, and the home screen caches a daily draw. Re-verify once on-device, then
      close. Data comes from the backend (with a local-deck fallback).'
    status: partial
- name: R1. Tradition preference — capture ✅ DONE
  items:
  - title: Onboarding tradition step — added page 4/5 ("How do you read the stars?" → Western / Vedic
      / Both / Not sure); saves tradition via SharedPreferences in _completeOnboarding (default both)
    status: done
  - title: Profile tradition toggle — editable selector (chips) in _EditProfileSheet + "Reading style"
      badge on profile
    status: done
  - title: Sign-difference education — info box on tradition step explaining the ~24° sidereal shift ("your
      Vedic Sun is often the previous sign")
    status: done
- name: R2. Tradition-aware daily reading — KEYSTONE — ✅ DONE (backend)
  items:
  - title: Sidereal reading path — /today now takes ?system=western|vedic (default western). Vedic uses
      new vedic_horoscope_prompt(moon_rashi, date) (Jyotishi framing on the Janma/Moon rashi, Sanskrit
      name + rashi lord via RASHI_INFO), same JSON shape → schema & mobile unchanged
    status: done
  - title: Cache key update — in-memory cache key is now (sign, system, date)
    status: done
  - title: System threaded end-to-end — today_horoscope → get_horoscope(sign, system, db) → generate_daily_horoscope(sign,
      date, system). Western AND Vedic are now DB-backed (see the system column work, Aug 4); originally
      Vedic was memory + AI + template only
    status: done
  - title: _Vedic DB persistence:_ DONE (Aug 4) — system VARCHAR(10) column on horoscopes + idempotent
      shared/db_migrations.py migration; horoscope_service reads/writes western AND vedic. _Deferred:_
      nakshatra-level detail
    status: done
  - title: _R3 scope:_ resolve WHICH rashi is the user's Moon sign (client-side, via existing sidereal
      /chart/vedic) and pass it as zodiac_sign with system=vedic — done in R3
    status: done
- name: R3. Sign-identity resolver — consistency — ✅ DONE
  items:
  - title: Resolver — new SignResolver.resolve(tradition, sunSign, birth…) → ReadingIdentity(readingSign,
      system). Western/Both → tropical Sun + system=western; Vedic → sidereal Moon rashi (Janma Rashi)
      + system=vedic. Moon sign is fetched once via /chart/vedic and cached in SharedPreferences (vedicMoonSign,
      keyed on birth inputs so it auto-invalidates)
    status: done
  - title: Wired end-to-end — getHoroscope(sign, {system}) now appends &system=; MainShell resolves identity
      before fetching (loads birth data first) and passes readingSign/system to Home; Home fetches + displays
      the resolved sign, with a "Moon sign · Janma Rashi" subtitle in Vedic mode
    status: done
  - title: Gate Vedic on birth time + place — Vedic chosen but time/place missing → falls back to Western
      and Home shows a tap-to-fix nudge ("Add your birth time & place…") that opens Profile. Transient
      chart-fetch failures fall back silently (no nag)
    status: done
  - title: _Deferred (R5):_ sidereal-Sun identity display, nakshatra-level reading, and making the standalone
      horoscope_screen.dart / chart_screen.dart (Western surfaces) tradition-aware
    status: pending
- name: R4. Adaptive navigation & framing — ✅ nav done (deep terms → R5)
  items:
  - title: Conditional tabs — tab set built in _MainShellState from tradition (both→all 5; western→Home/Chart/Match/Profile;
      vedic→Home/Kundli/Match/Profile); selected tab is preserved when the set changes
    status: done
  - title: Per-tradition labels — nav-level done (Vedic tab reads "Kundli" for Vedic users); in-screen
      Rising↔Lagna / Birth Chart↔Kundli relabels landed in R5 Jyotish terminology
    status: done
- name: R5. Authenticity polish — ✅ done
  items:
  - title: 'Jyotish terminology in Vedic mode (Rashi, Lagna, Graha, Nakshatra, Dasha) — kundli chart already
      uses Lagna/Nakshatra; Rising↔Lagna and Birth Chart↔Kundli now relabel on the Western surfaces a
      Vedic user still reaches: Share Cosmic Card (shareable_chart_card.dart/share_card_screen.dart —
      Rising→Lagna when tradition==''vedic''), Profile edit birth-time helper (profile_screen.dart), and
      the Vedic hub Dasha/Dosha copy (vedic_home_screen.dart — "birth chart"→"Kundli"). flutter analyze
      clean'
    status: done
  - title: Glossary / "why signs differ" explainer screen — new AstroGlossaryScreen (tropical vs. sidereal
      + ~24° Lahiri ayanamsa, plus Jyotish & Western term cards). Reachable via Profile → Astrology Guide.
      flutter analyze clean
    status: done
  - title: 'Vedic wheel defaults to North/South — already satisfied: kundli_chart_screen.dart defaults
      to _KundliChartStyle.north and uses Lagna/Nakshatra terminology (verified in R5)'
    status: done
  - title: '"Both" compare view — DONE (Jul 27). For tradition == ''both'' users with birth details, Home
      now fetches the Vedic Moon-rashi reading alongside the Western Sun reading and shows a segmented
      Western/Vedic toggle (each segment displays its sign + today''s score at a glance, Match-tab aesthetic).
      Tapping swaps the daily card + its tap-through to HoroscopeScreen; a subtle nudge prompts "both"
      users missing birth time/place to add them. Files: lib/screens/home_screen.dart (_buildTraditionCompare/_buildCompareSegment/_buildBothVedicHint,
      _loadVedicReading), lib/main.dart (passes tradition + birth details to Home). flutter analyze clean'
    status: done
