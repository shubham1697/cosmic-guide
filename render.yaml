services:
  - type: web
    name: cosmicguide-api
    runtime: python
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        scope: build
        value: sqlite:///./cosmicguide.db
      - key: SECRET_KEY
        scope: build
        value: change-me-in-production
      - key: GEMINI_API_KEY
        scope: build
        value: ""
