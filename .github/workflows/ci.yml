name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile check
        run: python -m compileall -q backend shared database

      # The suite is a set of standalone scripts (pytest is not a dependency).
      # Postgres-only tests self-skip when no server is reachable.
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  mobile:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # firebase_options.dart is gitignored (generated by `flutterfire configure`),
      # so CI needs a placeholder for the analyzer to resolve main.dart's import.
      - name: Stub firebase_options.dart if absent
        working-directory: mobile-app
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci-placeholder',
                  appId: 'ci-placeholder',
                  messagingSenderId: 'ci-placeholder',
                  projectId: 'ci-placeholder',
                );
          }
          EOF
          fi

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Run tests
        working-directory: mobile-app
        run: flutter test

      - name: Check formatting
        working-directory: mobile-app
        run: dart format --output=none --set-exit-if-changed lib

  release-config:
    name: Release config guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both of these are silent fallbacks at build time: a release build with
      # neither set compiles and installs happily, then fails every request and
      # is rejected by Play. Catch them here instead of in store reviews.
      - name: Release build must not use the placeholder API host
        working-directory: mobile-app
        run: |
          if grep -q "api.cosmicguide.app" lib/services/api_service.dart; then
            echo "::warning file=mobile-app/lib/services/api_service.dart::_fallbackProdBaseUrl is still the placeholder host. Release builds MUST pass --dart-define=API_BASE_URL=https://<real-host>/api/v1."
          fi

      - name: Release build must not be debug-signed
        working-directory: mobile-app
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::warning file=mobile-app/android/app/build.gradle.kts::android/key.properties is absent, so a release build now fails rather than silently using debug keys. Create the upload keystore before publishing."
          fi
