services:
  db:
    image: postgres:16-alpine
    container_name: cosmicguide-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cosmicguide
      POSTGRES_PASSWORD: cosmicguide
      POSTGRES_DB: cosmicguide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmicguide"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmicguide-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cosmicguide:cosmicguide@db:5432/cosmicguide
      - SECRET_KEY=local-dev-secret-key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=gemini-2.5-flash-lite
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - LOG_LEVEL=DEBUG
      - OLLAMA_BASE_URL=http://192.168.29.159:11434
      - IPHONE_LLM_BASE_URL=${IPHONE_LLM_BASE_URL:-http://192.168.29.162:8080/v1}
      - IPHONE_LLM_MODEL=${IPHONE_LLM_MODEL:-base}
      - IPHONE_LLM_API_KEY=${IPHONE_LLM_API_KEY:-not-needed}
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-/app/secrets/fcm.json}
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    restart: unless-stopped

  populate:
    build:
      context: .
      dockerfile: Dockerfile.database
    container_name: cosmicguide-populate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cosmicguide:cosmicguide@db:5432/cosmicguide
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash-lite}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.29.159:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - IPHONE_LLM_BASE_URL=${IPHONE_LLM_BASE_URL:-http://192.168.29.162:8080/v1}
      - IPHONE_LLM_MODEL=${IPHONE_LLM_MODEL:-base}
      - IPHONE_LLM_API_KEY=${IPHONE_LLM_API_KEY:-not-needed}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - IPHONE_LLM_TIMEOUT=${IPHONE_LLM_TIMEOUT:-600}
      - LOG_LEVEL=INFO
    profiles:
      - populate

  adminer:
    image: adminer:latest
    container_name: cosmicguide-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: unless-stopped

volumes:
  pgdata:
